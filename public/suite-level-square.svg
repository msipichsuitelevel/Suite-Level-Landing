<svg xmlns="http://www.w3.org/2000/svg" viewBox="30 54 180 132" version="1.1">
  <!-- The Suite Level mark: three bars and the orange peg. Same geometry as
       `favicon.svg` and the client's SuiteLevelMark, but with literal `fill`
       attributes instead of a `prefers-color-scheme` stylesheet, because this
       file is only ever rasterised (by `scripts/generate-icons.mjs`) and the
       renderer resolves no CSS media queries.

       The viewBox is cropped to the ink rather than kept square, so the icon
       script's own padding decides the whitespace and the bars stay legible at
       16px. Changing the mark means re-running `bun run icons`. -->
  <rect x="30" y="54" width="180" height="34" rx="17" fill="#585856" />
  <rect x="30" y="103" width="180" height="34" rx="17" fill="#585856" />
  <rect x="30" y="152" width="116" height="34" rx="17" fill="#585856" />
  <rect x="158" y="152" width="52" height="34" rx="17" fill="#F19220" />
</svg>
